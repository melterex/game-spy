<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпион — Стол</title>
    <script src="../js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Caveat:wght@700&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/room.css">
    <link rel="stylesheet" href="../css/player-avatars.css">
    <link rel="icon" href="/icon.png" type="image/png">
</head>
<body>

<div class="game-area">
    <div class="top-ui">
        <div class="top-ui-left">
            <div class="logo">Шпион</div>
            <div id="roomIdLabel" class="room-id-label"></div>
        </div>
        <div class="top-ui-right">
            <div id="timer" class="timer" aria-live="polite"></div>
            <button id="inviteBtn" class="link-btn invite-btn" type="button" onclick="openInviteModal()">Пригласить</button>
            <button class="link-btn exit-btn" onclick="exitRoom()">Выйти</button>
        </div>
    </div>

    <div class="side-players left" id="leftSide"></div>

    <div class="center-box">
        <div class="game-info">
            <div id="turnStatus" class="turn-status-banner hidden">Ожидание начала игры...</div>

            <label class="word-card" for="peekCard">
                <input type="checkbox" id="peekCard" class="peek-toggle" autocomplete="off" aria-label="Показать или скрыть слово">
                <span class="word-card-inner">
                    <span class="word-face word-cover">
                        <span class="word-cover-head">
                            <span class="card-label">Карта игрока</span>
                            <span class="hand word-cover-note">только вам!</span>
                        </span>
                        <span class="info-item hidden" id="themeBlock">
                            <span class="label">Тема</span>
                            <span id="themeValue" class="value"></span>
                        </span>
                        <span class="word-cover-hint">Нажмите, чтобы подсмотреть слово</span>
                    </span>
                    <span class="word-face word-reveal">
                        <span class="info-item hidden" id="wordBlock">
                            <span class="label">Ваше слово</span>
                            <span id="wordValue" class="value"></span>
                        </span>
                        <span class="word-cover-hint">Нажмите, чтобы спрятать</span>
                    </span>
                </span>
            </label>

            <div class="lobby-buttons">
                <button id="readyBtn" class="cta ink ready-btn">ГОТОВ</button>
                <button id="startGameBtn" class="cta blue ready-btn" disabled>СТАРТ ИГРЫ</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message"><span>Система:</span> Ожидание начала...</div>
        </div>
        <div class="chat-input-wrap">
            <label for="chatInput"><input type="text" id="chatInput" placeholder="Ваше сообщение..." autocomplete="off"></label>
            <button onclick="sendMessage()" aria-label="Отправить">➤</button>
        </div>
    </div>

    <div class="side-players right" id="rightSide"></div>
</div>

<div id="inviteModal" class="modal">
    <div class="modal-content card invite-modal">
        <span class="card-label">Одноразовый код</span>
        <h2 class="card-title">Пригласить за стол</h2>
        <p class="card-desc">Ссылка сажает за стол. Код сгорает после одного входа и живёт 15 минут. Каждому гостю нужен свой.</p>

        <div class="field">
            <span class="card-label">Ссылка</span>
            <a id="inviteLink" class="invite-value" target="_blank" rel="noopener">…</a>
            <button class="link-btn copy-link" type="button" onclick="copyInvite('link')">Скопировать ссылку</button>
        </div>
        <div class="field">
            <span class="card-label">Номер комнаты</span>
            <div id="inviteRoomId" class="invite-value">…</div>
            <button class="link-btn copy-link" type="button" onclick="copyInvite('room')">Скопировать номер</button>
        </div>
        <div class="field">
            <span class="card-label">Код</span>
            <div id="inviteOup" class="invite-value">…</div>
            <button class="link-btn copy-link" type="button" onclick="copyInvite('oup')">Скопировать код</button>
        </div>
        <p id="inviteError" class="form-error" hidden></p>

        <button class="cta ink confirm-btn" type="button" onclick="createInviteCode()">Новый код</button>
        <button class="link-btn cancel-link" type="button" onclick="closeInviteModal()">Закрыть</button>
    </div>
</div>

<script src="../js/auth-token.js"></script>
<script src="../js/config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
<script src="../js/signalr-init.js"></script>

<script src="../js/room-logic/myId.js"></script>
<script src="../js/room-logic/render-room.js"></script>
<script src="../js/room-logic/lobby-state.js"></script>
<script src="../js/room-logic/timer.js"></script>
<script src="../js/room-logic/chat/chat.js"></script>
<script src="../js/room-logic/start-game.js"></script>
<script src="../js/room-logic/room.js"></script>
<script src="../js/room-logic/invite.js"></script>
<script src="../js/room-logic/ready-button.js"></script>
<script src="../js/avatars/player-avatars.js"></script>
</body>
</html>
