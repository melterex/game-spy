<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шпион — Голосование</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Caveat:wght@700&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/vote.css">
</head>
<body>

<div class="page voting-container">
    <div class="top timer-section">
        <div class="logo">Шпион</div>
        <div class="timer-wrap">
            <span class="timer-label">осталось</span>
            <div class="timer-badge" id="timer">00:30</div>
        </div>
    </div>

    <h2 class="h voting-title">Кто шпион?</h2>
    <p class="muted voting-sub">Нажмите на игрока, которого подозреваете. Голос можно поменять.</p>

    <div class="users-grid" id="usersGrid"></div>

    <div class="finish-vote-section" id="finishVoteSection">
        <button id="finishVoteBtn" type="button" class="cta ink finish-vote-btn" disabled>
            Готов завершить
        </button>
        <p id="finishVoteHint" class="muted finish-vote-hint">Проголосуйте за игрока, чтобы подтвердить готовность завершить.</p>
    </div>
</div>

<div id="voteResultOverlay" class="vote-result-overlay hidden">
    <div class="card vote-result-modal">
        <span class="card-label">Итог раунда</span>
        <h2 id="voteResultTitle" class="vote-result-title"></h2>
        <p id="voteResultMessage" class="vote-result-message"></p>
        <button id="voteResultBtn" type="button" class="cta ink finish-vote-btn">В комнату</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
<script src="../js/signalr-init.js"></script>
<script src="../js/room-logic/myId.js"></script>
<script src="../js/room-logic/timer.js"></script>
<script src="../js/voting/voting-state.js"></script>
<script src="../js/voting/vote-storage.js"></script>
<script src="../js/voting/finish-vote.js"></script>
<script src="../js/voting/render-voting.js"></script>
<script src="../js/voting/cast-vote.js"></script>
<script src="../js/voting/vote-result.js"></script>
<script src="../js/voting/voting.js"></script>
</body>
</html>
